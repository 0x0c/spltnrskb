name: Deploy case viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - case/preview/viewer.html
      - case/preview/assembly.html
      - case/preview/model-data.js
      - docs/img/render-hero.png
      - docs/views.html
      - docs/3d/**
      - docs/img/details/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build site
        run: |
          mkdir -p _site
          wrap() {
            echo '<!doctype html>'
            echo '<html lang="ja"><head>'
            echo '<meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'
            echo '</head><body>'
            cat "$1"
            echo '</body></html>'
          }
          # views.html sits next to index.html on the site, not at ../../docs/
          wrap case/preview/viewer.html | sed 's#href="../../docs/views.html"#href="views.html"#' > _site/index.html
          wrap case/preview/assembly.html > _site/assembly.html
          wrap docs/views.html > _site/views.html
          # the close-up renders views.html shows, at the same relative paths, and its 3D model and lighting
          grep -oE 'img/[^"]+\.(png|jpg)' docs/views.html | sort -u | while read -r f; do
            mkdir -p "_site/$(dirname "$f")" && cp "docs/$f" "_site/$f"
          done
          cp -r docs/3d _site/3d
          cp case/preview/model-data.js _site/
          cp docs/img/render-hero.png _site/og.png
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
